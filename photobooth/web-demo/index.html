<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>一刻 Photobooth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <section class="screen" data-screen="home" id="screen-home">
      <div class="glow"></div>
      <div class="brand-block">
        <h1 class="brand">一刻</h1>
        <p class="brand-en">YIKE PHOTOBOOTH</p>
      </div>
      <div class="hero-visual">
        <div class="strip-mock" aria-hidden="true">
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <span>一刻</span>
        </div>
      </div>
      <div class="copy">
        <h2>拍下此刻，<br />拼成一条回忆。</h2>
        <p>倒计时连拍 · 滤镜边框 · 一键下载<br />参考悦时刻类大头贴流程 · 零后端</p>
      </div>
      <button class="cta" id="btn-start">开始拍摄</button>
    </section>

    <section class="screen hidden" data-screen="layout" id="screen-layout">
      <h3 class="section-title">版式</h3>
      <div class="layout-grid" id="layout-grid"></div>
      <h3 class="section-title">拍摄滤镜</h3>
      <div class="chip-row" id="filter-row"></div>
      <button class="cta" id="btn-to-shoot">下一步 · 开始连拍</button>
    </section>

    <section class="screen hidden" data-screen="shoot" id="screen-shoot">
      <div class="status-row">
        <strong id="shot-step">第 1 / 4 张</strong>
        <span id="shot-tip">摆好姿势，准备微笑</span>
      </div>
      <div class="camera-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="capture-canvas" class="hidden"></canvas>
        <div class="countdown hidden" id="countdown"></div>
        <div class="flash hidden" id="flash"></div>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <button class="cta" id="btn-shutter">开始倒计时连拍</button>
      <p class="hint" id="cam-hint"></p>
    </section>

    <section class="screen hidden" data-screen="select" id="screen-select">
      <h2 class="headline-sm">选出你最满意的照片</h2>
      <p class="sub" id="select-sub">已选 0 / 4</p>
      <div class="shot-grid" id="shot-grid"></div>
      <button class="cta" id="btn-to-decorate" disabled>下一步 · 装饰边框</button>
      <button class="cta ghost" id="btn-reshoot">重新拍摄</button>
    </section>

    <section class="screen hidden" data-screen="decorate" id="screen-decorate">
      <div class="preview-box" id="preview-box"></div>
      <h3 class="section-title">边框颜色</h3>
      <div class="colors" id="colors"></div>
      <h3 class="section-title">滤镜微调</h3>
      <div class="chip-row" id="filter-row-2"></div>
      <button class="cta" id="btn-compose">生成大头贴</button>
      <canvas id="strip-canvas" class="hidden"></canvas>
    </section>

    <section class="screen hidden" data-screen="result" id="screen-result">
      <h2 class="headline-sm">你的一刻已就绪</h2>
      <p class="sub">点击下载保存到本地</p>
      <div class="result-wrap">
        <img id="result-img" alt="大头贴结果" />
      </div>
      <a class="cta" id="btn-download" download="yike-photobooth.jpg">下载大头贴</a>
      <button class="cta ghost" id="btn-again">再拍一套</button>
    </section>
  </div>
  <script src="./app.js"></script>
</body>
</html>
